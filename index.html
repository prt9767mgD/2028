<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172a">
  <title>共通テストまであと何日？</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      background: #10172a;
      color: #f7f8fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #293b68 0, transparent 55%),
        #10172a;
    }

    main {
      width: min(100%, 760px);
      text-align: center;
    }

    .label {
      color: #aab8d8;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .16em;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(1.7rem, 6vw, 3rem);
      line-height: 1.3;
    }

    .target {
      margin: 0 0 36px;
      color: #b8c2d8;
      font-size: .95rem;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 18px);
    }

    .unit {
      padding: clamp(14px, 4vw, 28px) 8px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 20px;
      background: rgb(255 255 255 / 6%);
      box-shadow: 0 16px 40px rgb(0 0 0 / 18%);
    }

    .number {
      display: block;
      font-size: clamp(2rem, 10vw, 4.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      line-height: 1;
    }

    .unit-name {
      display: block;
      margin-top: 12px;
      color: #aab8d8;
      font-size: .85rem;
    }

    #message {
      min-height: 1.5em;
      margin-top: 28px;
      color: #c9d4eb;
    }

    @media (max-width: 420px) {
      body { padding: 18px; }
      .unit { border-radius: 14px; }
      .unit-name { font-size: .75rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="label">COUNTDOWN</div>
    <h1>大学入学共通テストまで</h1>
    <p class="target">目標日時：<time id="targetText"></time></p>

    <section class="timer" aria-label="目標日時までの残り時間">
      <div class="unit"><span class="number" id="days">0</span><span class="unit-name">日</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="unit-name">時間</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="unit-name">分</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="unit-name">秒</span></div>
    </section>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    // 目標日時を変更する場所（日本時間・UTC+09:00）
    // 日程が確定したら、公式発表に合わせて変更してください。
    const TARGET_DATE = "2028-01-15T00:00:00+09:00";

    const target = new Date(TARGET_DATE);
    const targetText = document.getElementById("targetText");
    const message = document.getElementById("message");

    targetText.textContent = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(target);

    function updateCountdown() {
      const remaining = target.getTime() - Date.now();

      if (remaining <= 0) {
        ["days", "hours", "minutes", "seconds"].forEach(id => {
          document.getElementById(id).textContent = "0";
        });
        message.textContent = "目標日時になりました。";
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      document.getElementById("days").textContent =
        Math.floor(totalSeconds / 86400);
      document.getElementById("hours").textContent =
        String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");
      document.getElementById("minutes").textContent =
        String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      document.getElementById("seconds").textContent =
        String(totalSeconds % 60).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
